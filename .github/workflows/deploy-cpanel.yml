name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hapsight.com

      - name: Prepare standalone folder
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt
          find .next/standalone -type f -empty -exec sh -c 'echo "" > "$1"' _ {} \;

      - name: Pack the site
        run: tar -czf site.tgz -C .next/standalone .

      - name: Upload over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 26742
          source: site.tgz
          target: hapsight-upload

      - name: Unpack and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 26742
          script: |
            set -e
            mkdir -p ~/hapsight
            tar -xzf ~/hapsight-upload/site.tgz -C ~/hapsight
            rm -rf ~/hapsight-upload
            mkdir -p ~/hapsight/tmp
            touch ~/hapsight/tmp/restart.txt
            # restart.txt alone does not always restart the app: after PR #44 the old Node
            # process kept serving the previous build. Restart it through cPanel's Node.js
            # selector; if that is not available, stop the old process so the web server
            # starts a fresh one (with the new build) on the next request.
            if command -v cloudlinux-selector >/dev/null 2>&1 \
              && cloudlinux-selector restart --json --interpreter nodejs --app-root hapsight; then
              echo "App restarted with cloudlinux-selector"
            else
              echo "cloudlinux-selector restart not available, stopping the old Node process"
              pkill -u "$(id -u)" -f "hapsight/server.js" || true
              pkill -u "$(id -u)" -f "lsnode:.*hapsight" || true
            fi

      # Wake the restarted app (so the first visitor doesn't wait) and log what the site serves.
      - name: Check the live site
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hapsight.com/?deploy=${GITHUB_SHA}") || code=000
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          curl -sI "https://hapsight.com/" | grep -i -E "^HTTP|x-nextjs-cache|etag" || true
