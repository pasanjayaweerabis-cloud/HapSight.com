name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hapsight.com

      - name: Prepare standalone folder
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt
          find .next/standalone -type f -empty -exec sh -c 'echo "" > "$1"' _ {} \;

      - name: Pack the site
        run: tar -czf site.tgz -C .next/standalone .

      - name: Upload over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 26742
          source: site.tgz
          target: hapsight-upload

      - name: Unpack and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 26742
          script: |
            set -e
            mkdir -p ~/hapsight
            tar -xzf ~/hapsight-upload/site.tgz -C ~/hapsight
            rm -rf ~/hapsight-upload
            # Next.js saves rendered pages in .next/server/route-cache (and .next/cache) at run
            # time. Unpacking over the old folder never cleared them, so after PR #44 the app kept
            # serving pages saved from the previous build. Clear them so it renders the new build.
            rm -rf ~/hapsight/.next/server/route-cache ~/hapsight/.next/cache
            mkdir -p ~/hapsight/tmp
            touch ~/hapsight/tmp/restart.txt
            # Restart through cPanel's Node.js selector. It can print an error and still exit 0,
            # so only trust it when it reports success; otherwise stop the old process so the
            # web server starts a fresh one on the next request.
            out=""
            if command -v cloudlinux-selector >/dev/null 2>&1; then
              out=$(cloudlinux-selector restart --json --interpreter nodejs --app-root hapsight 2>&1 || true)
              echo "cloudlinux-selector: $out"
            fi
            case "$out" in
              *'"result": "success"'*) echo "App restarted with cloudlinux-selector" ;;
              *)
                echo "Selector restart did not confirm success, stopping the old Node process"
                pkill -u "$(id -u)" -f "hapsight/server.js" || true
                pkill -u "$(id -u)" -f "lsnode:.*hapsight" || true
                ;;
            esac
            # the old process may have saved a page again while we restarted: clear once more
            sleep 3
            rm -rf ~/hapsight/.next/server/route-cache

      # Wake the restarted app (so the first visitor doesn't wait) and log what the site serves.
      - name: Check the live site
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://hapsight.com/?deploy=${GITHUB_SHA}") || code=000
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          curl -sI "https://hapsight.com/" | grep -i -E "^HTTP|x-nextjs-cache|etag" || true
