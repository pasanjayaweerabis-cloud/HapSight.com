name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://hapsight.com

      - name: Prepare standalone folder
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt
          find .next/standalone -type f -empty -exec sh -c 'echo "" > "$1"' _ {} \;

      - name: Pack the site
        run: tar -czf site.tgz -C .next/standalone .

      - name: Upload over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 26742
          source: site.tgz
          target: hapsight-upload

      - name: Unpack and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 26742
          script: |
            set -e
            mkdir -p ~/hapsight
            tar -xzf ~/hapsight-upload/site.tgz -C ~/hapsight
            rm -rf ~/hapsight-upload
            mkdir -p ~/hapsight/tmp
            touch ~/hapsight/tmp/restart.txt
